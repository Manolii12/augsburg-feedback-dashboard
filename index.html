<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online-Dienst Feedback Dashboard · Stadt Augsburg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23165a32'/><text x='16' y='22' text-anchor='middle' font-size='16' fill='white' font-family='serif'>A</text></svg>" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 56 56" width="48" height="48">
            <path d="M28 6c1.2 2.4 1.8 4.2 1.6 6.2-.2 1.4-1 2.6-2.2 3.4l.8 1.4c.4.7.3 1.5-.2 2.1-.6.7-1.6.9-2.4.5l-.8-.5-.8.5c-.8.4-1.8.2-2.4-.5-.5-.6-.6-1.4-.2-2.1l.8-1.4c-1.2-.8-2-2-2.2-3.4C19.8 10.2 20.4 8.4 21.6 6 23.4 8.2 25.4 9.4 28 6z" fill="#c41e3a"/>
            <path d="M14 46 L28 12 L42 46 H34.5 L28 30 21.5 46z" fill="#165a32"/>
          </svg>
        </div>
        <div>
          <strong>Stadt Augsburg</strong>
          <span>Gemeinsam für unsere Stadt</span>
        </div>
      </div>

      <nav class="nav" aria-label="Hauptnavigation">
        <button class="nav-item is-active" data-view="overview">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
          Übersicht
        </button>
        <button class="nav-item" data-view="ratings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 3 15 9 21.5 9.8 16.8 14.4 18.2 21 12 17.6 5.8 21 7.2 14.4 2.5 9.8 9 9"/></svg>
          Bewertungen
        </button>
        <button class="nav-item" data-view="details">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>
          Details
        </button>
        <button class="nav-item" data-view="feedback">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14v10H8l-3 3z"/></svg>
          Feedback (Text)
        </button>
        <button class="nav-item" data-view="export">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/></svg>
          Export
        </button>
      </nav>

      <div class="skyline" aria-hidden="true">
        <svg viewBox="0 0 220 90" preserveAspectRatio="xMidYEnd meet">
          <path fill="#d7eadb" d="M0 90h220V58h-10v-18h-8V58h-6V42h-14v16h-4V30l-10-8-10 8v28h-8V48h-12v10h-6V36h-16v22h-8V50h-10v12H88V28l-12-10-12 10v32H52V46H40v12H32V38H18v20H0z"/>
        </svg>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1>Online-Dienst Feedback Dashboard</h1>
          <p>Auswertung der Bürger*innenbewertungen</p>
        </div>
        <div class="filters">
          <label class="filter">
            <span>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
              Zeitraum
            </span>
            <select id="filter-period"></select>
          </label>
          <label class="filter">
            <span>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>
              Dienststelle
            </span>
            <select id="filter-office"></select>
          </label>
          <label class="filter">
            <span>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
              Online-Service
            </span>
            <select id="filter-service"></select>
          </label>
          <div class="updated">
            Letzte Aktualisierung<br /><strong id="updated-at"></strong>
          </div>
          <button class="icon-btn" id="info-btn" title="Hinweise" aria-label="Hinweise">i</button>
        </div>
      </header>

      <main id="view-root"></main>

      <footer class="hint">
        <span class="info-dot">i</span>
        Hinweis: Die dargestellten Daten sind fiktiv und dienen ausschließlich als Clickdummy. Sie können je nach Filter variieren.
      </footer>
    </div>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header>
        <h2 id="modal-title"></h2>
        <button class="icon-btn" id="modal-close" aria-label="Schließen">×</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
